name: Build and Push Docker Image

on:
  release:
    types: [published]

# 使用并发取消任何当前作业或运行
concurrency:
  group: ${{github.ref}}
  cancel-in-progress: true

jobs:
  deploy_target:
    if: startsWith(github.ref, 'refs/tags/event-backend/')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      platform: ${{ steps.platform.outputs.platform }}
      runner: ${{ steps.platform.outputs.runner }}
      mode: ${{ steps.platform.outputs.mode }}
      smoke_host: ${{ steps.platform.outputs.smoke_host }}
    steps:
      - name: Resolve deployment platform
        id: platform
        run: |
          payload=$(jq -er '.release.body | fromjson | objects' "$GITHUB_EVENT_PATH")
          platform=$(jq -er 'if .targetPlatform == null then "linux/amd64" else .targetPlatform end' <<< "$payload")
          mode=$(jq -er 'if .deploymentMode == null then "standard" else .deploymentMode end' <<< "$payload")
          tag=$(jq -er '.branch | strings' <<< "$payload")
          case "$platform" in
            linux/amd64) runner=ubuntu-latest ;;
            linux/arm64) runner=ubuntu-24.04-arm ;;
            *) echo "::error::Unsupported targetPlatform in release payload"; exit 1 ;;
          esac
          case "$mode:$tag" in
            arm64-smoke:*-arm64)
              if [ "$platform" != linux/arm64 ]; then
                echo "::error::ARM64 smoke requires an ARM64 target"
                exit 1
              fi
              smoke_host=$(jq -er '.remoteHost | strings | select(test("^[A-Za-z0-9][A-Za-z0-9.-]*$"))' <<< "$payload")
              printf 'smoke_host=%s\n' "$smoke_host" >> "$GITHUB_OUTPUT"
              ;;
            standard:*-arm64)
              echo "::error::ARM64 smoke tag is missing its deployment mode"
              exit 1
              ;;
            standard:*) ;;
            *)
              echo "::error::Invalid deployment mode or ARM64 smoke tag"
              exit 1
              ;;
          esac
          printf 'platform=%s\nrunner=%s\nmode=%s\n' "$platform" "$runner" "$mode" >> "$GITHUB_OUTPUT"

  action_trigger:
    needs: deploy_target
    runs-on: ${{ needs.deploy_target.outputs.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
    # Exposed so prune-images / notify-teams can run as separate jobs without re-parsing the Release.
    outputs:
      remote_host: ${{ steps.deploy-vars.outputs.remote_host }}
      teams_webhook: ${{ steps.deploy-vars.outputs.teams_webhook }}
      active: ${{ steps.deploy-vars.outputs.active }}
      image_tag: ${{ steps.deploy-vars.outputs.image_tag }}
      deployment_mode: ${{ needs.deploy_target.outputs.mode }}
      channel: ${{ steps.deploy-vars.outputs.channel }}
      ecr_registry: ${{ steps.login-pf-aws-ecr.outputs.registry }}
      source_repo: ${{ steps.relinfo.outputs.source_repo }}
      commit_sha: ${{ steps.relinfo.outputs.commit_sha }}
      commit_short: ${{ steps.relinfo.outputs.commit_short }}
      commit_message: ${{ steps.relinfo.outputs.commit_message }}
      commit_url: ${{ steps.relinfo.outputs.commit_url }}
      release_notes: ${{ steps.relinfo.outputs.release_notes }}

    steps:
      - name: get tag info
        uses: Seechange-edu/Parse-Action-Tag@main
        with:
          githubToken: ${{ secrets.ACTION_TOKEN }}
          type: parse

      # Runs before the build so notify-teams still has the webhook/tag when a later step fails.
      - name: Export deploy vars
        id: deploy-vars
        run: |
          {
            echo "remote_host=${{ env.REMOTE_HOST }}"
            echo "teams_webhook=${{ env.TEAMS_WEBHOOK }}"
            echo "active=${{ env.ACTIVE }}"
            echo "image_tag=${{ env.BRANCH }}"
            echo "channel=${{ env.PUSHREF }}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: SeeChange-edu/${{ env.REPOSITORY }}
          token: ${{ secrets.ACTION_TOKEN }}
          ref: ${{ env.BRANCH }}

      # Commit + release notes for the Teams card. Runs before the build so a failed build still notifies with context.
      - name: Collect commit and release info
        id: relinfo
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN }}
          SRC_REPO: SeeChange-edu/${{ env.REPOSITORY }}
          REF: ${{ env.BRANCH }}
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          # Release notes exist only when BRANCH is a release tag (prod); empty for branch deploys (dev/uat).
          NOTES=$(gh release view "$REF" --repo "$SRC_REPO" --json body -q .body 2>/dev/null | head -c 1500 || true)
          # Fallback text keeps the card's notes block non-empty (avoids relying on Adaptive Card isVisible).
          if [ -z "$NOTES" ]; then NOTES="_(no release notes — branch deploy)_"; fi
          D=$(openssl rand -hex 8)
          {
            echo "source_repo=$SRC_REPO"
            echo "commit_sha=$SHA"
            echo "commit_short=$SHORT"
            echo "commit_url=${{ github.server_url }}/$SRC_REPO/commit/$SHA"
            echo "commit_message<<$D"
            echo "$SUBJECT"
            echo "$D"
            echo "release_notes<<$D"
            echo "$NOTES"
            echo "$D"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: corretto
          cache: maven

      - name: Maven Build
        run: mvn package -T 1C -D skipTests -D fast

      - name: Setup AWS ECR Details (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-pf-aws-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        env:
          TARGET_PLATFORM: ${{ needs.deploy_target.outputs.platform }}
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          ACTIVE: ${{ env.ACTIVE }}
          IMAGE_TAG: ${{ env.BRANCH }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}:${IMAGE_TAG}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker build --platform "$TARGET_PLATFORM" --tag "${IMAGE_URI}" --file Dockerfile-Self .
          docker push ${IMAGE_URI}

      - name: Get ECR login token
        id: ecr-login-token
        run: |
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ vars.AWS_REGION }})
          echo "token<<EOF" >> $GITHUB_OUTPUT
          echo "$ECR_TOKEN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: SSH and Run Docker image
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.deploy_target.outputs.mode == 'arm64-smoke' && needs.deploy_target.outputs.smoke_host || env.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_TOKEN,ECR_REGISTRY,IMAGE_URI,TARGET_PLATFORM,DEPLOYMENT_MODE
          script: |
            # Login to AWS ECR using temporary token from GitHub Actions
            echo ${ECR_TOKEN} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            host_platform=$(docker info --format '{{.OSType}}/{{.Architecture}}') || exit 1
            case "$host_platform" in
              linux/x86_64) host_platform=linux/amd64 ;;
              linux/aarch64) host_platform=linux/arm64 ;;
            esac
            if [ "$host_platform" != "$TARGET_PLATFORM" ]; then
              echo "Deployment aborted: Docker host is $host_platform, expected $TARGET_PLATFORM" >&2
              exit 1
            fi

            docker pull "${IMAGE_URI}" || exit 1
            image_platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_URI}") || exit 1
            if [ "$image_platform" != "$TARGET_PLATFORM" ]; then
              echo "Deployment aborted: image is $image_platform, expected $TARGET_PLATFORM" >&2
              exit 1
            fi

            if [ "$DEPLOYMENT_MODE" = arm64-smoke ]; then
              smoke_name="${{ env.NAME }}-arm64-smoke"
              if docker container inspect "$smoke_name" >/dev/null 2>&1; then
                docker rm -f "$smoke_name" || exit 1
              fi
              # Load the production entrypoint without access to live dependencies.
              docker run --name "$smoke_name" -d --network none --log-driver local \
                -e SPRING_PROFILES_ACTIVE=prod "${IMAGE_URI}" || exit 1
              trap 'docker stop "$smoke_name" >/dev/null 2>&1 || true' EXIT
              for attempt in $(seq 1 45); do
                if docker logs "$smoke_name" 2>&1 | grep -Eq 'Starting .* using Java'; then
                  echo "ARM64 smoke passed: Spring Boot reached application initialization (network disabled)."
                  exit 0
                fi
                running=$(docker inspect --format '{{.State.Running}}' "$smoke_name") || exit 1
                [ "$running" = true ] || break
                sleep 1
              done
              echo "ARM64 smoke failed: Spring Boot did not reach application initialization." >&2
              exit 1
            fi

            if [ "$(docker ps -a --format '{{.Names}}' | grep -c ${{ env.NAME }})" -gt 0 ]; then
              docker rm -f ${{ env.NAME }}
            fi
            docker run --name ${{ env.NAME }} -d \
              -p ${{ env.OUT_PORT }}:${{ env.PORT }} \
              ${{ env.RUN_ARGS }} \
              --restart unless-stopped \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-east-1 \
              --log-opt awslogs-group=/docker/${{ env.NAME }} \
              --log-opt awslogs-stream=${{ env.ACTIVE }} \
              --log-opt awslogs-create-group=true \
              ${IMAGE_URI}
            # Image pruning moved to the prune-images job, which never fails the
            # run: a prune already running on the host would fail this script and
            # mark a deploy that actually succeeded as red.
            # Disabled: the old container is already removed by name above, and pruning here would delete
            # a container that crashed on startup, taking its logs with it.
            # docker container prune --force
        env:
          TARGET_PLATFORM: ${{ needs.deploy_target.outputs.platform }}
          DEPLOYMENT_MODE: ${{ needs.deploy_target.outputs.mode }}
          ECR_REGISTRY: ${{ steps.login-pf-aws-ecr.outputs.registry }}
          ECR_TOKEN: ${{ steps.ecr-login-token.outputs.token }}
          IMAGE_URI: ${{ env.IMAGE_URI }}

  # Housekeeping only: never fails the run.
  prune-images:
    needs: [action_trigger]
    if: needs.action_trigger.result == 'success' && needs.action_trigger.outputs.deployment_mode != 'arm64-smoke'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      # Its own step, and its own continue-on-error: a prune already running on
      # the host fails this one, and a failed step would otherwise skip the
      # sweep below along with it.
      - name: Prune dangling Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          # A mutable tag such as :dev takes its name off the previous image on
          # every pull, leaving layers the sweep below never looks at.
          script: docker image prune --force

      - name: Prune old semver Docker images
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ needs.action_trigger.outputs.ecr_registry }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.action_trigger.outputs.image_tag }}
          ACTIVE: ${{ needs.action_trigger.outputs.active }}
        with:
          host: ${{ needs.action_trigger.outputs.remote_host }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,ACTIVE
          script: |
            IMAGE_PREFIX="${ECR_REGISTRY}/${ECR_REPOSITORY}/${ACTIVE}"
            CURRENT="${IMAGE_TAG}"

            if ! echo "$CURRENT" | grep -qE '^[vV][0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Skip prune: IMAGE_TAG '${CURRENT}' is not semver"
              exit 0
            fi

            if ! LOCAL_IMAGES=$(docker images --format '{{.Repository}} {{.Tag}}'); then
              echo "Skip version prune: could not list local Docker images" >&2
              exit 0
            fi

            mapfile -t TAGS < <(
              awk -v repo="$IMAGE_PREFIX" '$1 == repo { print $2 }' <<< "$LOCAL_IMAGES" \
                | grep -E '^[vV][0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V
            )

            if ! grep -Fxq -- "$CURRENT" <<< "$(printf '%s\n' "${TAGS[@]}")"; then
              echo "Skip version prune: ${IMAGE_PREFIX}:${CURRENT} is not in the local version list"
              exit 0
            fi

            PREV=$(printf '%s\n' "${TAGS[@]}" | sort -V | awk -v cur="$CURRENT" '
              { a[++n]=$0 }
              END { for(i=1;i<=n;i++) if(a[i]==cur && i>1) { print a[i-1]; exit } }')

            if [ -n "$PREV" ]; then
              echo "Keep: ${CURRENT}, ${PREV}"
            else
              echo "Keep: ${CURRENT} only (no previous version)"
            fi

            for tag in "${TAGS[@]}"; do
              [ "$tag" = "$CURRENT" ] && continue
              [ -n "$PREV" ] && [ "$tag" = "$PREV" ] && continue
              echo "Removing ${IMAGE_PREFIX}:${tag}"
              docker rmi "${IMAGE_PREFIX}:${tag}" 2>/dev/null || true
            done

  # User-facing notes after a successful production deploy. Dev and UAT stay
  # on PUSHREF dev/uat. release-meta decides single, joint, or nothing.
  # A failure here does not fail the deploy.
  changelog:
    needs: [action_trigger]
    if: needs.action_trigger.result == 'success' && needs.action_trigger.outputs.deployment_mode != 'arm64-smoke' && needs.action_trigger.outputs.channel == 'prod'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/changelog-run.yml
    with:
      source_repo: ${{ needs.action_trigger.outputs.source_repo }}
      tag: ${{ needs.action_trigger.outputs.image_tag }}
      soft_fail: true
    secrets: inherit

  # Notification only: never fails the run.
  # Targets the Teams "Workflows" webhook (Post to a channel when a webhook request is received),
  # which renders the Adaptive Card in attachments[0].content as-is.
  notify-teams:
    needs: [action_trigger]
    if: always() && needs.action_trigger.outputs.teams_webhook != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Send Teams notification (Power Automate)
        env:
          WEBHOOK: ${{ needs.action_trigger.outputs.teams_webhook }}
          STATUS: ${{ needs.action_trigger.result }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPO: ${{ needs.action_trigger.outputs.source_repo }}
          ENVIRONMENT: ${{ needs.action_trigger.outputs.active }}
          TAG: ${{ needs.action_trigger.outputs.image_tag }}
          COMMIT_SHA: ${{ needs.action_trigger.outputs.commit_sha }}
          COMMIT_SHORT: ${{ needs.action_trigger.outputs.commit_short }}
          COMMIT_MESSAGE: ${{ needs.action_trigger.outputs.commit_message }}
          COMMIT_URL: ${{ needs.action_trigger.outputs.commit_url }}
          RELEASE_NOTES: ${{ needs.action_trigger.outputs.release_notes }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # jq builds the whole Adaptive Card so release notes / commit messages are escaped safely.
          # The Teams Workflows webhook renders attachments[0].content verbatim.
          jq -n \
            --arg status "$STATUS" \
            --arg source_repo "$SOURCE_REPO" \
            --arg environment "$ENVIRONMENT" \
            --arg tag "$TAG" \
            --arg commit_short "$COMMIT_SHORT" \
            --arg commit_message "$COMMIT_MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg release_notes "$RELEASE_NOTES" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg run_url "$RUN_URL" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  msteams: { width: "Full" },
                  body: [
                    {
                      type: "Container",
                      style: (if $status == "success" then "good" else "attention" end),
                      bleed: true,
                      items: [
                        {
                          type: "TextBlock",
                          text: (if $status == "success" then "✅ Deploy succeeded" else "❌ Deploy failed" end),
                          weight: "Bolder",
                          size: "Medium",
                          wrap: true
                        },
                        {
                          type: "TextBlock",
                          text: ($source_repo + " → " + $environment),
                          spacing: "None",
                          isSubtle: true,
                          wrap: true
                        }
                      ]
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "Environment", value: $environment },
                        { title: "Tag / Branch", value: $tag },
                        { title: "Commit", value: ("[" + $commit_short + "](" + $commit_url + ")") },
                        { title: "Commit message", value: $commit_message },
                        { title: "Triggered by", value: ($actor + " (" + $event + ")") },
                        { title: "Result", value: $status }
                      ]
                    },
                    { type: "TextBlock", text: "**Release notes**", wrap: true, spacing: "Medium" },
                    {
                      type: "Container",
                      style: "emphasis",
                      items: [ { type: "TextBlock", text: $release_notes, wrap: true } ]
                    }
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "View workflow run", url: $run_url },
                    { type: "Action.OpenUrl", title: "View commit", url: $commit_url }
                  ]
                }
              }]
            }' \
          | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
